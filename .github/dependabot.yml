version: 2

updates:
  # Keep pnpm workspace dependencies current.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        # Review lint-rule changes independently from routine package updates.
        exclude-patterns:
          - "eslint-config-next"
        update-types:
          - "minor"
          - "patch"

  # Keep Python dependencies and the uv lockfile current.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      uv-minor-patch:
        patterns:
          - "*"
        # Keep the experimental pre-1.0 ty checker in its own PR.
        exclude-patterns:
          - "ty"
        update-types:
          - "minor"
          - "patch"

  # Keep GitHub Actions used by workflows up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
