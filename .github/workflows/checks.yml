name: ✅ PR checks (quality gate)

on:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: 🐍 Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install deps
        run: uv sync --locked --group dev

      - name: Ruff (lint)
        run: uv run --locked ruff check .

      - name: Ruff (format check)
        run: uv run --locked ruff format --check .

      - name: Ty
        run: uv run --locked ty check apps/backend/fathom

      - name: Pre-commit hooks
        env:
          SKIP: no-commit-to-branch
        run: uv run --locked pre-commit run --all-files

      - name: OpenAPI contract
        run: PYTHONPATH=apps/backend uv run --locked python scripts/export_openapi.py packages/api-client/openapi.json --check

      - name: Backend tests
        run: ./.venv/bin/python -m unittest discover -s apps/backend/tests -t apps/backend

  frontend:
    name: 🌐 Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @fathom/web lint

      - name: Typecheck
        run: pnpm --filter @fathom/web typecheck

      - name: Typecheck API client
        run: pnpm --filter @fathom/api-client typecheck

      - name: Generated API client
        run: pnpm --filter @fathom/api-client check:generated

      - name: Unit tests
        run: pnpm --filter @fathom/web test

      - name: Install browser
        run: pnpm --filter @fathom/web exec playwright install --with-deps chromium

      - name: Browser accessibility tests
        run: pnpm --filter @fathom/web test:browser

      - name: Build
        run: pnpm --filter @fathom/web build
        env:
          # Compile-only CI origin. Hosted builds must replace this with their
          # exact public HTTPS origin.
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
