name: ✅ PR checks (quality gate)

on:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: 🐍 Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true

      - name: Install deps
        run: uv sync --group dev

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: Ty
        run: uv run ty check apps/backend/fathom

      - name: Backend tests
        run: ./.venv/bin/python -m unittest discover -s apps/backend/tests -t apps/backend

  frontend:
    name: 🌐 Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @fathom/web lint

      - name: Typecheck
        run: pnpm --filter @fathom/web typecheck

      - name: Typecheck API client
        run: pnpm --filter @fathom/api-client typecheck

      - name: Unit tests
        run: pnpm --filter @fathom/web test

      - name: Install browser
        run: pnpm --filter @fathom/web exec playwright install --with-deps chromium

      - name: Browser accessibility tests
        run: pnpm --filter @fathom/web test:browser

      - name: Build
        run: pnpm --filter @fathom/web build
