name: ✅ PR checks (quality gate)

on:
  pull_request:

permissions:
  contents: read

jobs:
  backend-unit:
    name: 🧹 Backend quality and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install deps
        run: uv sync --locked --group dev

      - name: Ruff (lint)
        run: uv run --locked ruff check .

      - name: Ruff (format check)
        run: uv run --locked ruff format --check .

      - name: Ty
        run: uv run --locked ty check apps/backend/fathom

      - name: Pre-commit hooks
        env:
          SKIP: no-commit-to-branch
        run: uv run --locked pre-commit run --all-files

      - name: OpenAPI contract
        run: PYTHONPATH=apps/backend uv run --locked python scripts/export_openapi.py packages/api-client/openapi.json --check

      - name: Backend unit tests
        run: ./.venv/bin/python -m unittest discover -s apps/backend/tests/unit -t apps/backend

  backend-runtime:
    name: 🧪 Backend integration and E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install deps
        run: uv sync --locked --group dev

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.111.0

      - name: Start local Supabase
        run: supabase start

      - name: Apply migrations
        run: supabase migration up --local

      - name: Backend database integration tests
        run: |
          source <(supabase status -o env)
          FATHOM_TEST_DATABASE_URL="$DB_URL" \
            ./.venv/bin/python -m unittest discover \
            -s apps/backend/tests/integration -t apps/backend

      - name: Backend E2E tests
        run: |
          source <(supabase status -o env)
          FATHOM_RUN_E2E=1 \
          FATHOM_E2E_SUPABASE_URL="$API_URL" \
          FATHOM_E2E_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" \
          FATHOM_E2E_SECRET_KEY="$SECRET_KEY" \
          FATHOM_E2E_DATABASE_URL="$DB_URL" \
            ./.venv/bin/python -m unittest discover \
            -s apps/backend/tests/e2e -t apps/backend

  backend:
    name: 🐍 Backend
    if: always()
    needs:
      - backend-unit
      - backend-runtime
    runs-on: ubuntu-latest
    steps:
      - name: Verify backend checks
        env:
          UNIT_RESULT: ${{ needs.backend-unit.result }}
          RUNTIME_RESULT: ${{ needs.backend-runtime.result }}
        run: |
          if [[ "$UNIT_RESULT" != "success" || "$RUNTIME_RESULT" != "success" ]]; then
            echo "A required backend check failed or was cancelled."
            exit 1
          fi

  frontend:
    name: 🌐 Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @fathom/web lint

      - name: Typecheck
        run: pnpm --filter @fathom/web typecheck

      - name: Typecheck API client
        run: pnpm --filter @fathom/api-client typecheck

      - name: Generated API client
        run: pnpm --filter @fathom/api-client check:generated

      - name: Unit tests
        run: pnpm --filter @fathom/web test

      - name: Build
        run: pnpm --filter @fathom/web build
        env:
          # Compile-only CI origin. Hosted builds must replace this with their
          # exact public HTTPS origin.
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
