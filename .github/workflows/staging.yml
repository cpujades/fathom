name: 🚧 Staging

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    secrets:
      SUPABASE_ACCESS_TOKEN:
        required: true
      SUPABASE_PROJECT_REF:
        description: Resolved from the staging environment.
        required: false
      SUPABASE_DB_PASSWORD:
        description: Resolved from the staging environment.
        required: false
  workflow_dispatch:
    inputs:
      release_tag:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      release_ref: ${{ steps.release.outputs.ref }}
      supabase: ${{ steps.filter.outputs.supabase }}
    steps:
      - name: Checkout release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${RELEASE_TAG}"
            exit 1
          fi
          if ! git rev-parse --verify "refs/tags/${RELEASE_TAG}^{tag}" >/dev/null 2>&1; then
            echo "Unknown annotated release tag: ${RELEASE_TAG}"
            exit 1
          fi

          echo "ref=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Detect Supabase changes
        id: filter
        env:
          RELEASE_TAG: ${{ steps.release.outputs.ref }}
        shell: bash
        run: |
          set -euo pipefail

          previous_tag="$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)"
          if [[ -z "${previous_tag}" ]]; then
            echo "supabase=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "${previous_tag}" "${RELEASE_TAG}" -- supabase; then
            echo "supabase=false" >> "$GITHUB_OUTPUT"
          else
            echo "supabase=true" >> "$GITHUB_OUTPUT"
          fi

  supabase:
    name: 🗄️ Deploy Supabase migrations to staging
    needs: changes
    if: needs.changes.outputs.supabase == 'true'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.changes.outputs.release_ref }}

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.111.0

      - name: Validate Supabase configuration (staging)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail

          missing=()
          [[ -n "${SUPABASE_ACCESS_TOKEN}" ]] || missing+=(SUPABASE_ACCESS_TOKEN)
          [[ -n "${SUPABASE_PROJECT_REF}" ]] || missing+=(SUPABASE_PROJECT_REF)
          [[ -n "${SUPABASE_DB_PASSWORD}" ]] || missing+=(SUPABASE_DB_PASSWORD)

          if (( ${#missing[@]} > 0 )); then
            for name in "${missing[@]}"; do
              echo "::error title=Missing staging secret::Configure ${name} in the staging environment."
            done
            exit 1
          fi

      - name: Link Supabase project (staging)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy migrations (staging)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db push --dry-run
          supabase --yes db push
