name: 🗄️ Supabase (PR) — validate migrations

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: 🧪 Validate Supabase DB migrations (local)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect Supabase changes
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            supabase:
              - 'supabase/**'
              - '.github/workflows/supabase-*.yml'

      - name: No Supabase changes (skip)
        if: steps.changes.outputs.supabase != 'true'
        run: echo "No changes under supabase/** — skipping DB validation."

      - name: Set up Supabase CLI
        if: steps.changes.outputs.supabase == 'true'
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.111.0

      # We only need Postgres for migrations/linting.
      - name: Start local database
        if: steps.changes.outputs.supabase == 'true'
        run: supabase db start

      - name: Apply migrations
        if: steps.changes.outputs.supabase == 'true'
        run: supabase migration up --local

      - name: Test database access boundaries
        if: steps.changes.outputs.supabase == 'true'
        run: supabase test db supabase/tests/database

      - name: Lint database schema
        if: steps.changes.outputs.supabase == 'true'
        run: supabase db lint --local --fail-on warning
