name: 🗄️ Supabase (PR) — validate migrations

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: 🧪 Validate Supabase DB migrations (local)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.111.0

      # Validation uses only disposable local services. It never contacts a hosted project.
      - name: Start local Supabase
        run: supabase db start

      - name: Apply migrations
        run: supabase migration up --local

      - name: Test database access boundaries
        run: supabase test db supabase/tests/database

      - name: Lint database schema
        run: supabase db lint --local --fail-on warning
