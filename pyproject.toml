[project]
name = "fathom"
version = "0.24.0"
description = "Talven source-linked YouTube briefing service"
readme = "README.md"
# Why: some compiled dependencies (e.g. pydantic-core via PyO3) may not support Python 3.14 yet.
# Pinning prevents uv/pyenv from selecting an interpreter that can't build/install wheels reliably.
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.1",
  "python-dotenv==1.2.2",
  "openai==2.54.0",
  "markdown==3.10.3",
  "weasyprint==69.0",
  "pydantic==2.13.4",
  "supabase==2.31.0",
  "pyjwt==2.13.0",
  "pydantic-settings==2.15.0",
  "asyncpg==0.31.0",
  "typing-extensions==4.16.0",
  "groq>=1.6.0",
  "pytubefix>=10.10.1",
]

[dependency-groups]
dev = [
  # Local debugging
  "debugpy==1.8.21",
  # Lint/format
  "ruff==0.16.2",
  # Type-checking
  "ty==0.0.63",
  # Git hooks runner
  "pre-commit==4.6.2",
  # Build backend: keep executable release build code in uv.lock.
  "hatchling==1.31.0",
  "editables==0.6",
]

[build-system]
requires = ["hatchling==1.31.0", "editables==0.6"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Why: backend packages live under apps/backend; sources maps that prefix so the wheel contains `fathom`.
packages = ["apps/backend/fathom"]

[tool.hatch.build.targets.wheel.sources]
# Map apps/backend to root so that apps/backend/fathom is distributed as fathom.
"apps/backend" = ""

[tool.hatch.build.targets.sdist]
include = ["apps/backend", "README.md", "AGENTS.md", "pyproject.toml"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["data", "playground"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["fathom"]

[tool.ty.environment]
root = ["apps/backend"]

[tool.ty.src]
respect-ignore-files = true

[tool.ty.rules]
all = "error"
